
name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: android-release

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
          cache: gradle

      - name: Install Android CLI
        run: |
          set -euo pipefail

          sudo install -d -m 0755 /etc/apt/keyrings

          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub |
            sudo tee /etc/apt/keyrings/google.asc >/dev/null

          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] http://dl.google.com/android/cli/latest/debian/ stable main" |
            sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null

          sudo apt-get update
          sudo apt-get install -y android-cli

          android --version

      - name: Install Android SDK Packages
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME"

          android --sdk="$ANDROID_HOME" sdk install \
            platforms/android-36.1 \
            build-tools/36.0.0 \
            platform-tools

      - name: Generate Debug Keystore
        run: |
          set -euo pipefail

          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          chmod 600 "$GITHUB_WORKSPACE/debug.keystore"

      - name: Test and Build Signed APK and AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64 secret}"
          : "${STORE_PASSWORD:?Missing STORE_PASSWORD secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD secret}"

          KEYSTORE_PATH="$RUNNER_TEMP/upload-key.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias upload >/dev/null

          export KEYSTORE_PATH STORE_PASSWORD KEY_PASSWORD

          chmod +x gradlew

          ./gradlew --stacktrace \
            spotlessCheck \
            :app:detekt \
            :app:testDebugUnitTest \
            :app:testReleaseUnitTest \
            :app:jacocoTestReport \
            :app:lintVitalRelease \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Remove Temporary Debug Keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/debug.keystore"

      - name: Upload Release Artifacts and Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sobji-dokan-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/detekt/
            app/build/reports/jacoco/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-release*
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab \
            --verify-tag \
            --title "Sobji Dokan $GITHUB_REF_NAME" \
            --generate-notes
